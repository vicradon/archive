<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MigViz — TypeORM Migration Visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f6f8fa;
  --bg2: #ffffff;
  --bg3: #f0f3f6;
  --bg4: #e8ecf0;
  --border: #d0d7de;
  --border2: #c1cad4;
  --border3: #9baab8;
  --text: #1a2332;
  --text2: #4a5568;
  --text3: #8896a8;
  --accent: #1a7f37;
  --accent2: #218a3c;
  --green: #1a7f37;
  --green-bg: #dafbe1;
  --green-border: #aceebb;
  --red: #cf222e;
  --red-bg: #fff0ee;
  --red-border: #ffcecb;
  --amber: #9a6700;
  --amber-bg: #fdf8e0;
  --amber-border: #f0d070;
  --purple: #6e40c9;
  --purple-bg: #f0eeff;
  --purple-border: #c8b8f8;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Syne', sans-serif;
  --radius: 10px;
  --radius-lg: 16px;
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ── Layout ── */
.app {
  display: grid;
  grid-template-rows: auto 1fr;
  min-height: 100vh;
}

header {
  border-bottom: 1px solid var(--border);
  padding: 0 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 58px;
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(246,248,250,0.95);
  backdrop-filter: blur(12px);
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}

.logo-mark {
  width: 30px; height: 30px;
  background: var(--accent);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.5px;
  font-family: var(--sans);
}

.logo-text {
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.3px;
}

.logo-text span { color: var(--accent); }

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.badge-version {
  font-family: var(--mono);
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 99px;
  border: 1px solid var(--border2);
  color: var(--text3);
  letter-spacing: 0.04em;
  background: var(--bg2);
}

/* ── Main layout ── */
main {
  display: grid;
  grid-template-columns: 380px 1fr;
  min-height: calc(100vh - 58px);
}

/* ── Sidebar ── */
.sidebar {
  border-right: 1px solid var(--border);
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
  position: sticky;
  top: 58px;
  height: calc(100vh - 58px);
  overflow-y: auto;
}

.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-track { background: transparent; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.section-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--text3);
  text-transform: uppercase;
  margin-bottom: 0.5rem;
}

.input-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.input-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
}

.tab-btn {
  flex: 1;
  padding: 10px 10px;
  font-size: 13px;
  font-weight: 600;
  font-family: var(--sans);
  color: var(--text3);
  background: transparent;
  border: none;
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.02em;
}

.tab-btn.active {
  color: var(--accent);
  background: var(--bg3);
  border-bottom: 2px solid var(--accent);
}

.tab-btn:hover:not(.active) { color: var(--text2); background: var(--bg3); }

textarea#migration-input {
  width: 100%;
  min-height: 200px;
  max-height: 300px;
  padding: 12px;
  font-size: 12.5px;
  font-family: var(--mono);
  color: var(--text);
  background: var(--bg2);
  border: none;
  outline: none;
  resize: vertical;
  line-height: 1.7;
  display: block;
}

textarea#migration-input::placeholder { color: var(--text3); }

.drop-zone {
  min-height: 120px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  transition: all 0.2s;
  padding: 1.5rem;
  display: none;
}

.drop-zone.active-tab { display: flex; }
.drop-zone:hover, .drop-zone.dragging { background: var(--bg3); }

.drop-icon {
  width: 36px; height: 36px;
  border: 1.5px dashed var(--border3);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: var(--text3);
  transition: all 0.2s;
}

.drop-zone:hover .drop-icon, .drop-zone.dragging .drop-icon {
  border-color: var(--accent);
  color: var(--accent);
}

.drop-text { font-size: 13px; color: var(--text3); text-align: center; }
.drop-text strong { color: var(--text2); display: block; margin-bottom: 2px; }

#file-input { display: none; }
#file-name { font-family: var(--mono); font-size: 10px; color: var(--green); padding: 6px 12px; border-top: 1px solid var(--border); display: none; }

.action-row {
  display: flex;
  gap: 8px;
}

.btn {
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 600;
  padding: 8px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border2);
  background: var(--bg3);
  color: var(--text2);
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.02em;
  white-space: nowrap;
}

.btn:hover { background: var(--bg4); color: var(--text); border-color: var(--border3); }

.btn.primary {
  background: var(--accent);
  color: #fff;
  border-color: transparent;
  flex: 1;
}

.btn.primary:hover { background: #8b7afa; }

.btn.ghost {
  background: transparent;
  border-color: var(--border);
  color: var(--text3);
}

.btn.ghost:hover { background: var(--bg2); color: var(--text2); }

.btn:disabled { opacity: 0.35; cursor: not-allowed; }

.btn-icon {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

/* ── Export panel ── */
.export-panel {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.export-panel-header {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  font-weight: 600;
  color: var(--text2);
}

.export-options {
  display: flex;
  flex-direction: column;
  gap: 1px;
  background: var(--border);
}

.export-option {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: var(--bg2);
  cursor: pointer;
  transition: all 0.12s;
  border: none;
  width: 100%;
  text-align: left;
}

.export-option:hover { background: var(--bg3); }
.export-option:disabled { opacity: 0.35; cursor: not-allowed; }

.export-icon {
  width: 28px; height: 28px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  flex-shrink: 0;
}

.export-icon.png { background: var(--purple-bg); color: var(--purple); border: 1px solid var(--purple-border); }
.export-icon.pdf { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
.export-icon.json { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }
.export-icon.sql { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }

.export-meta { flex: 1; }
.export-label { font-size: 13px; font-weight: 600; color: var(--text); }
.export-desc { font-size: 11px; color: var(--text3); margin-top: 1px; }

/* ── Canvas ── */
.canvas {
  padding: 2rem;
  overflow-y: auto;
  background: var(--bg);
}

.canvas::-webkit-scrollbar { width: 6px; }
.canvas::-webkit-scrollbar-track { background: transparent; }
.canvas::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* ── Empty state ── */
.empty-state {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  text-align: center;
  padding: 3rem;
}

.empty-glyph {
  width: 72px; height: 72px;
  border: 1.5px dashed var(--border2);
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  color: var(--text3);
}

.empty-title { font-size: 18px; font-weight: 700; color: var(--text2); }
.empty-sub { font-size: 13px; color: var(--text3); max-width: 360px; line-height: 1.6; }

/* ── Result area ── */
#result-area { display: none; }

.result-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
  gap: 10px;
}

.migration-title {
  font-size: 22px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -0.3px;
}

.migration-ts {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text3);
  margin-top: 3px;
}

.header-actions { display: flex; gap: 8px; }

/* ── Summary bar ── */
.summary-bar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 1.5rem;
}

.summary-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border-radius: 99px;
  font-size: 12px;
  font-weight: 600;
  border: 1px solid var(--border2);
  color: var(--text2);
  background: var(--bg2);
}

.chip-dot { width: 6px; height: 6px; border-radius: 50%; }
.chip-dot.added { background: var(--green); }
.chip-dot.removed { background: var(--red); }
.chip-dot.modified { background: var(--amber); }
.chip-dot.constraint { background: var(--purple); }
.chip-dot.enum { background: var(--accent2); }

/* ── Table card ── */
.table-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-bottom: 1rem;
  transition: border-color 0.2s;
}

.table-card:hover { border-color: var(--border2); }

.table-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg3);
}

.table-card-left {
  display: flex;
  align-items: center;
  gap: 8px;
}

.table-icon {
  width: 28px; height: 28px;
  background: var(--bg4);
  border: 1px solid var(--border2);
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: var(--text3);
}

.table-name {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}

.change-pill {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 99px;
  font-family: var(--sans);
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text3);
}

/* ── Diff grid ── */
.diff-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
}

.diff-pane {
  padding: 8px 0 4px;
}

.diff-pane:first-child {
  border-right: 1px solid var(--border);
}

.pane-header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 14px 8px;
}

.pane-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text3);
}

.pane-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  flex-shrink: 0;
}

.before-dot { background: var(--red); }
.after-dot { background: var(--green); }

/* ── Field rows ── */
.field-row {
  display: flex;
  align-items: baseline;
  gap: 6px;
  padding: 5px 14px;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.6;
  transition: background 0.1s;
}

.field-row:hover { background: var(--bg3); }

.field-row.added { background: var(--green-bg); }
.field-row.added:hover { background: #c6f4d0; }
.field-row.removed { background: var(--red-bg); }
.field-row.removed:hover { background: #ffd8d5; }
.field-row.modified { background: var(--amber-bg); }
.field-row.modified:hover { background: #faedb8; }
.field-row.unchanged { }

.field-marker {
  font-size: 12px;
  font-weight: 600;
  min-width: 12px;
  flex-shrink: 0;
}

.added .field-marker { color: var(--green); }
.removed .field-marker { color: var(--red); }
.modified .field-marker { color: var(--amber); }
.unchanged .field-marker { color: transparent; }

.field-name {
  font-weight: 600;
  color: var(--text);
  flex-shrink: 0;
}

.field-type {
  color: var(--text3);
  font-size: 12px;
  flex-shrink: 0;
}

.field-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  margin-left: 2px;
}

.fbadge {
  font-size: 10px;
  font-family: var(--sans);
  font-weight: 600;
  padding: 1px 5px;
  border-radius: 4px;
  letter-spacing: 0.04em;
}

.fbadge.nn { background: rgba(239,68,68,0.12); color: var(--red); border: 1px solid var(--red-border); }
.fbadge.def { background: rgba(245,158,11,0.1); color: var(--amber); border: 1px solid var(--amber-border); }
.fbadge.uq { background: var(--purple-bg); color: var(--purple); border: 1px solid var(--purple-border); }
.fbadge.pk { background: rgba(124,106,247,0.15); color: var(--accent2); border: 1px solid rgba(124,106,247,0.3); }

.empty-pane {
  padding: 12px 14px;
  font-size: 12px;
  font-family: var(--sans);
  color: var(--text3);
  font-style: italic;
}

/* ── Footer sections ── */
.card-footer {
  border-top: 1px solid var(--border);
}

.constraints-section {
  padding: 8px 14px;
  border-bottom: 1px solid var(--border);
}

.footer-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 5px;
}

.constraint-chips { display: flex; flex-wrap: wrap; gap: 4px; }

.ctag {
  font-family: var(--mono);
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 5px;
  border: 1px solid;
}

.ctag.fk { color: var(--purple); border-color: var(--purple-border); background: var(--purple-bg); }
.ctag.uq { color: var(--accent2); border-color: var(--green-border); background: var(--green-bg); }
.ctag.removed-c { color: var(--red); border-color: var(--red-border); background: var(--red-bg); }

.base-fields-note {
  padding: 8px 14px;
  font-size: 11.5px;
  font-family: var(--mono);
  color: var(--text3);
}

/* ── Enum section ── */
.enum-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-bottom: 1rem;
}

.enum-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg3);
  display: flex;
  align-items: center;
  gap: 8px;
}

.enum-header-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text2);
}

.enum-rows { padding: 6px 0; }

.enum-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 14px;
}

.enum-row:hover { background: var(--bg3); }

.enum-action {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.enum-action.created { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
.enum-action.dropped { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
.enum-action.replaced { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }

.enum-name-text {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}

.enum-vals-text {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text3);
}

/* ── Error banner ── */
#error-banner {
  display: none;
  margin: 1.5rem;
  padding: 10px 14px;
  background: var(--red-bg);
  border: 1px solid var(--red-border);
  border-radius: var(--radius);
  font-size: 13px;
  color: var(--red);
}

/* ── Toast ── */
#toast {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  padding: 10px 16px;
  background: var(--text);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 600;
  color: var(--bg2);
  z-index: 999;
  opacity: 0;
  transform: translateY(8px);
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}

#toast.show { opacity: 1; transform: translateY(0); }
#toast .toast-icon { font-size: 14px; }

/* ── Loading overlay ── */
#loading {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(246,248,250,0.85);
  z-index: 200;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  backdrop-filter: blur(4px);
}

#loading.show { display: flex; }

.spinner {
  width: 36px; height: 36px;
  border: 2px solid var(--border2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading-text { font-size: 13px; color: var(--text2); font-family: var(--sans); font-weight: 600; }

/* ── Export highlight ── */
#export-target {
  background: var(--bg);
  padding: 0;
}

/* ── Scrollbar ── */
.canvas::-webkit-scrollbar { width: 4px; }

@media (max-width: 900px) {
  main { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; }
  .diff-grid { grid-template-columns: 1fr; }
  .diff-pane:first-child { border-right: none; border-bottom: 1px solid var(--border); }
}
</style>
</head>
<body>

<div class="app">
  <header>
    <a class="logo" href="#">
      <div class="logo-mark">M</div>
      <span class="logo-text">Mig<span>Viz</span></span>
    </a>
    <div class="header-right">
      <span class="badge-version">TypeORM · PostgreSQL</span>
    </div>
  </header>

  <main>
    <!-- Sidebar -->
    <aside class="sidebar">
      <div>
        <div class="section-label">Migration source</div>
        <div class="input-card">
          <div class="input-tabs">
            <button class="tab-btn active" onclick="switchTab('paste')">Paste</button>
            <button class="tab-btn" onclick="switchTab('upload')">Upload file</button>
          </div>
          <textarea id="migration-input" placeholder="Paste your TypeORM migration here..."></textarea>
          <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()"
            ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
            <div class="drop-icon">↑</div>
            <div class="drop-text"><strong>Drop your .ts or .js file</strong>or click to browse</div>
            <input type="file" id="file-input" accept=".ts,.js" onchange="handleFile(event)">
          </div>
          <div id="file-name"></div>
        </div>
      </div>

      <div class="action-row">
        <button class="btn ghost btn-icon" onclick="loadExample()">⌘ Example</button>
        <button class="btn primary btn-icon" onclick="parseMigration()">Visualize →</button>
      </div>

      <div>
        <div class="section-label">Export</div>
        <div class="export-panel">
          <div class="export-options">
            <button class="export-option" onclick="exportPNG()" disabled id="btn-png">
              <div class="export-icon png">⬡</div>

            <button class="export-option" onclick="exportPDF()" disabled id="btn-pdf">
              <div class="export-icon pdf">▤</div>
              <div class="export-meta">
                <div class="export-label">PDF Document</div>
                <div class="export-desc">Multi-page printable report</div>
              </div>
            </button>
            <button class="export-option" onclick="exportJSON()" disabled id="btn-json">
              <div class="export-icon json">{}</div>
              <div class="export-meta">
                <div class="export-label">JSON Schema</div>
                <div class="export-desc">Parsed diff as structured data</div>

            </button>
            <button class="export-option" onclick="exportSQL()" disabled id="btn-sql">
              <div class="export-icon sql">▷</div>
              <div class="export-meta">
                <div class="export-label">Clean SQL</div>
                <div class="export-desc">Extracted up() queries only</div>

    </aside>

    <!-- Canvas -->
    <section class="canvas">
      <div id="error-banner"></div>

      <div class="empty-state" id="empty-state">
        <div class="empty-glyph">⇄</div>
        <div class="empty-title">No migration loaded</div>
        <div class="empty-sub">Paste a TypeORM migration file or upload a .ts/.js file to see a visual before/after diff of your schema changes.</div>
        <button class="btn btn-icon" onclick="loadExample()">Load example migration</button>
      </div>

      <div id="result-area">
        <div id="export-target">
          <div class="result-header">
            <div>
              <div class="migration-title" id="result-title">—</div>
              <div class="migration-ts" id="result-ts"></div>
            </div>
          </div>
          <div class="summary-bar" id="summary-bar"></div>
          <div id="tables-output"></div>
        </div>
      </div>
    </section>
  </main>
</div>

<div id="loading">
  <div class="spinner"></div>
  <div class="loading-text">Exporting…</div>
</div>

<div id="toast"><span class="toast-icon">✓</span><span id="toast-msg">Done</span></div>

<script>
// ── State ──
let parsedData = null;
let rawUpQueries = [];
let activeTab = 'paste';

// ── Tab switching ──
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', (i === 0) === (tab === 'paste')));
  const ta = document.getElementById('migration-input');
  const dz = document.getElementById('drop-zone');
  ta.style.display = tab === 'paste' ? 'block' : 'none';
  dz.style.display = tab === 'upload' ? 'flex' : 'none';
}

// ── File handling ──
function handleFile(e) {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    document.getElementById('migration-input').value = ev.target.result;
    const fn = document.getElementById('file-name');
    fn.textContent = '✓ ' + f.name;
    fn.style.display = 'block';
  };
  r.readAsText(f);
}

function handleDragOver(e) {
  e.preventDefault();
  document.getElementById('drop-zone').classList.add('dragging');
}

function handleDragLeave(e) {
  document.getElementById('drop-zone').classList.remove('dragging');
}

function handleDrop(e) {
  e.preventDefault();
  document.getElementById('drop-zone').classList.remove('dragging');
  const f = e.dataTransfer.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    document.getElementById('migration-input').value = ev.target.result;
    const fn = document.getElementById('file-name');
    fn.textContent = '✓ ' + f.name;
    fn.style.display = 'block';
    switchTab('upload');
  };
  r.readAsText(f);
}

// ── Example ──
const EXAMPLE = `import { MigrationInterface, QueryRunner } from "typeorm";

export class EntityLifecycleRefactor1774470208701 implements MigrationInterface {
    name = 'EntityLifecycleRefactor1774470208701'

    public async up(queryRunner: QueryRunner): Promise<void> {
        // Remove deprecated status field and enum
        await queryRunner.query(\`ALTER TABLE "entity_records" DROP COLUMN "legacy_status"\`);
        await queryRunner.query(\`DROP TYPE "public"."entity_records_legacy_status_enum"\`);

        // Remove obsolete boolean flag
        await queryRunner.query(\`ALTER TABLE "related_assets" DROP COLUMN "is_flagged_complete"\`);

        // Add temporal tracking to logs
        await queryRunner.query(\`ALTER TABLE "activity_logs" ADD "completed_at" TIMESTAMP WITH TIME ZONE\`);

        // Introduce new status enum for logs
        await queryRunner.query(\`CREATE TYPE "public"."activity_logs_state_enum" AS ENUM('INITIATED', 'IN_PROGRESS', 'FINALIZED', 'ARCHIVED')\`);
        await queryRunner.query(\`ALTER TABLE "activity_logs" ADD "state" "public"."activity_logs_state_enum" NOT NULL DEFAULT 'INITIATED'\`);

        // Introduce polymorphic type classification
        await queryRunner.query(\`CREATE TYPE "public"."entities_category_enum" AS ENUM('PRIMARY', 'SECONDARY', 'TERTIARY')\`);
        await queryRunner.query(\`ALTER TABLE "entities" ADD "category" "public"."entities_category_enum" NOT NULL DEFAULT 'PRIMARY'\`);

        // Add verification flag to attachments
        await queryRunner.query(\`ALTER TABLE "attachments" ADD "is_verified" boolean DEFAULT false\`);

        // Add identifier and new enum status to entity_records
        await queryRunner.query(\`ALTER TABLE "entity_records" ADD "reference_code" character varying\`);
        await queryRunner.query(\`CREATE TYPE "public"."entity_records_state_enum" AS ENUM('ACTIVE', 'PENDING_REVIEW', 'DISABLED')\`);
        await queryRunner.query(\`ALTER TABLE "entity_records" ADD "state" "public"."entity_records_state_enum"\`);

        // Normalize relationship key type
        await queryRunner.query(\`ALTER TABLE "entity_records" DROP COLUMN "entity_id"\`);
        await queryRunner.query(\`ALTER TABLE "entity_records" ADD "entity_id" uuid\`);

        // Enforce uniqueness and relational integrity
        await queryRunner.query(\`ALTER TABLE "entity_records" ADD CONSTRAINT "UQ_entity_records_entity_id" UNIQUE ("entity_id")\`);
        await queryRunner.query(\`ALTER TABLE "entity_records" ADD CONSTRAINT "FK_entity_records_entity_id" FOREIGN KEY ("entity_id") REFERENCES "entities"("id") ON DELETE CASCADE ON UPDATE NO ACTION\`);

        // Remove default from core entity status for stricter control
        await queryRunner.query(\`ALTER TABLE "entities" ALTER COLUMN "status" DROP DEFAULT\`);

        // Add indexing for performance
        await queryRunner.query(\`CREATE INDEX "IDX_activity_logs_state" ON "activity_logs" ("state")\`);
        await queryRunner.query(\`CREATE INDEX "IDX_entities_category" ON "entities" ("category")\`);
    }

    public async down(queryRunner: QueryRunner): Promise<void> {
        // Drop indexes
        await queryRunner.query(\`DROP INDEX "public"."IDX_entities_category"\`);
        await queryRunner.query(\`DROP INDEX "public"."IDX_activity_logs_state"\`);

        // Restore default status
        await queryRunner.query(\`ALTER TABLE "entities" ALTER COLUMN "status" SET DEFAULT 'draft'\`);

        // Remove FK + unique constraint
        await queryRunner.query(\`ALTER TABLE "entity_records" DROP CONSTRAINT "FK_entity_records_entity_id"\`);
        await queryRunner.query(\`ALTER TABLE "entity_records" DROP CONSTRAINT "UQ_entity_records_entity_id"\`);

        // Revert entity_id type
        await queryRunner.query(\`ALTER TABLE "entity_records" DROP COLUMN "entity_id"\`);
        await queryRunner.query(\`ALTER TABLE "entity_records" ADD "entity_id" character varying\`);

        // Remove new state and identifier
        await queryRunner.query(\`ALTER TABLE "entity_records" DROP COLUMN "state"\`);
        await queryRunner.query(\`DROP TYPE "public"."entity_records_state_enum"\`);
        await queryRunner.query(\`ALTER TABLE "entity_records" DROP COLUMN "reference_code"\`);

        // Remove attachment verification flag
        await queryRunner.query(\`ALTER TABLE "attachments" DROP COLUMN "is_verified"\`);

        // Remove entity category
        await queryRunner.query(\`ALTER TABLE "entities" DROP COLUMN "category"\`);
        await queryRunner.query(\`DROP TYPE "public"."entities_category_enum"\`);

        // Remove log state + timestamp
        await queryRunner.query(\`ALTER TABLE "activity_logs" DROP COLUMN "state"\`);
        await queryRunner.query(\`DROP TYPE "public"."activity_logs_state_enum"\`);
        await queryRunner.query(\`ALTER TABLE "activity_logs" DROP COLUMN "completed_at"\`);

        // Restore removed boolean flag
        await queryRunner.query(\`ALTER TABLE "related_assets" ADD "is_flagged_complete" boolean NOT NULL DEFAULT false\`);

        // Restore legacy status enum + column
        await queryRunner.query(\`CREATE TYPE "public"."entity_records_legacy_status_enum" AS ENUM('NEW', 'PROCESSING', 'DONE', 'FAILED')\`);
        await queryRunner.query(\`ALTER TABLE "entity_records" ADD "legacy_status" "public"."entity_records_legacy_status_enum"\`);
    }
}`;

function loadExample() {
  document.getElementById('migration-input').value = EXAMPLE;
  switchTab('paste');
  parseMigration();
}

// ── Parsing ──
function extractQueries(src, section) {
  const regex = new RegExp(`async\\s+${section}\\s*\\([^)]*\\)[^{]*{([\\s\\S]*?)^\\s{4}}`, 'm');
  const match = src.match(regex);
  if (!match) return [];
  const body = match[1];
  const queries = [];
  const qr = /queryRunner\.query\(`([^`]+)`\)/g;
  let m;
  while ((m = qr.exec(body)) !== null) queries.push(m[1].trim());
  return queries;
}

function extractMigrationName(src) {
  const m = src.match(/(?:class\s+(\w+)\s+implements|name\s*=\s*['"`]([^'"`]+)['"`])/);
  return m ? (m[2] || m[1]) : 'UnknownMigration';
}

function extractTimestamp(name) {
  const m = name.match(/(\d{13,})/);
  if (!m) return null;
  return new Date(parseInt(m[1])).toLocaleString();
}

function parseColDef(name, rest) {
  const notes = [];
  let type = rest;
  if (/NOT NULL/i.test(rest)) { notes.push('NOT NULL'); type = type.replace(/NOT NULL/i, '').trim(); }
  const defMatch = rest.match(/DEFAULT\s+(\S+)/i);
  if (defMatch) { notes.push('DEFAULT ' + defMatch[1]); type = type.replace(/DEFAULT\s+\S+/i, '').trim(); }
  if (/\bUNIQUE\b/i.test(rest)) { notes.push('UNIQUE'); type = type.replace(/\bUNIQUE\b/i, '').trim(); }
  type = type
    .replace(/TIMESTAMP WITH TIME ZONE/gi, 'timestamptz')
    .replace(/CHARACTER VARYING(\(\d+\))?/gi, 'varchar$1')
    .replace(/BOOLEAN/gi, 'boolean')
    .replace(/"public"\."([^"]+)"/gi, (_, e) => {
      const parts = e.split('_');
      return 'enum:' + parts.slice(-3).join('_').replace(/_enum$/, '');
    })
    .replace(/\s+/g, ' ')
    .trim()
    .toLowerCase();
  return { name, type, notes };
}

function parseCreateTable(q) {
  // Match: CREATE TABLE "name" (col1 type1, col2 type2, CONSTRAINT ...)
  const headerMatch = q.match(/^CREATE TABLE\s+"?(\w+)"?\s*\((.+)\)$/is);
  if (!headerMatch) return null;
  const tableName = headerMatch[1];
  const body = headerMatch[2];
  const columns = [];
  const constraints = [];
  // Split by top-level commas (ignore commas inside parens)
  const parts = [];
  let depth = 0, cur = '';
  for (const ch of body) {
    if (ch === '(') { depth++; cur += ch; }
    else if (ch === ')') { depth--; cur += ch; }
    else if (ch === ',' && depth === 0) { parts.push(cur.trim()); cur = ''; }
    else cur += ch;
  }
  if (cur.trim()) parts.push(cur.trim());
  for (const part of parts) {
    if (/^CONSTRAINT\s+/i.test(part)) {
      const cm = part.match(/^CONSTRAINT\s+"?(\w+)"?\s+(.+)$/i);
      if (cm) constraints.push({ name: cm[1], def: cm[2].trim() });
    } else {
      // column definition: "colname" type ...
      const colMatch = part.match(/^"?(\w+)"?\s+(.+)$/i);
      if (colMatch) columns.push(parseColDef(colMatch[1], colMatch[2]));
    }
  }
  return { tableName, columns, constraints };
}

function parseQueries(queries) {
  const tables = {};
  const enums = {};
  const newTables = {};   // CREATE TABLE
  const droppedTables = new Set(); // DROP TABLE
  function getTable(n) {
    if (!tables[n]) tables[n] = { added: [], removed: [], modified: [], constraints: { added: [], removed: [] } };
    return tables[n];
  }
  for (const q of queries) {
    // CREATE TABLE
    if (/^CREATE TABLE\s+/i.test(q)) {
      const parsed = parseCreateTable(q);
      if (parsed) { newTables[parsed.tableName] = { columns: parsed.columns, constraints: parsed.constraints }; }
      continue;
    }
    // DROP TABLE
    const dropTable = q.match(/^DROP TABLE\s+(?:IF EXISTS\s+)?"?(\w+)"?/i);
    if (dropTable) { droppedTables.add(dropTable[1]); continue; }

    const dropType = q.match(/^DROP TYPE\s+"?(?:public\.")?([^"\s]+)"?$/i);
    if (dropType) { const k = dropType[1].replace(/"/g,''); enums[k] = {...(enums[k]||{}), dropped:true}; continue; }
    const createEnum = q.match(/^CREATE TYPE\s+"?(?:public\.")?([^"(]+)"?\s+AS ENUM\s*\((.+)\)/i);
    if (createEnum) { const k = createEnum[1].trim().replace(/"/g,''); const vals = createEnum[2].match(/'([^']+)'/g)?.map(v=>v.replace(/'/g,''))||[]; enums[k]={...(enums[k]||{}),created:true,values:vals}; continue; }
    const addCol = q.match(/^ALTER TABLE\s+"?(\w+)"?\s+ADD\s+(?:COLUMN\s+)?"(\w+)"\s+(.+)$/i);
    if (addCol) { const [,t,c,r]=addCol; getTable(t).added.push(parseColDef(c,r)); continue; }
    const dropCol = q.match(/^ALTER TABLE\s+"?(\w+)"?\s+DROP\s+(?:COLUMN\s+)?"(\w+)"$/i);
    if (dropCol) { const [,t,c]=dropCol; getTable(t).removed.push({name:c}); continue; }
    const alterCol = q.match(/^ALTER TABLE\s+"?(\w+)"?\s+ALTER\s+(?:COLUMN\s+)?"(\w+)"\s+(.+)$/i);
    if (alterCol) { const [,t,c,ch]=alterCol; getTable(t).modified.push({name:c,change:ch.trim()}); continue; }
    const addConst = q.match(/^ALTER TABLE\s+"?(\w+)"?\s+ADD CONSTRAINT\s+"(\w+)"\s+(.+)$/i);
    if (addConst) { const [,t,cn,cd]=addConst; getTable(t).constraints.added.push({name:cn,def:cd.trim()}); continue; }
    const dropConst = q.match(/^ALTER TABLE\s+"?(\w+)"?\s+DROP CONSTRAINT\s+"(\w+)"$/i);
    if (dropConst) { const [,t,cn]=dropConst; getTable(t).constraints.removed.push({name:cn}); continue; }
  }
  return {tables, enums, newTables, droppedTables};
}

function parseMigration() {
  const src = document.getElementById('migration-input').value.trim();
  const errBanner = document.getElementById('error-banner');
  errBanner.style.display = 'none';
  if (!src) { showError('Paste a migration or load the example first.'); return; }
  const upQueries = extractQueries(src, 'up');
  if (!upQueries.length) { showError('Could not find any up() queries. Check your migration format.'); return; }
  rawUpQueries = upQueries;
  const migName = extractMigrationName(src);
  const ts = extractTimestamp(migName);
  const { tables, enums, newTables, droppedTables } = parseQueries(upQueries);
  if (!Object.keys(tables).length && !Object.keys(enums).length && !Object.keys(newTables).length && !droppedTables.size) { showError('No schema changes detected.'); return; }
  parsedData = { migName, ts, tables, enums, newTables, droppedTables };
  renderResult(parsedData);
  enableExports();
}

function showError(msg) {
  const el = document.getElementById('error-banner');
  el.textContent = msg;
  el.style.display = 'block';
}

function enableExports() {
  ['btn-png','btn-pdf','btn-json','btn-sql'].forEach(id => {
    document.getElementById(id).disabled = false;
  });
}

// ── Rendering ──
function renderResult({ migName, ts, tables, enums, newTables, droppedTables }) {
  document.getElementById('empty-state').style.display = 'none';
  const ra = document.getElementById('result-area');
  ra.style.display = 'block';

  document.getElementById('result-title').textContent = migName;
  document.getElementById('result-ts').textContent = ts ? 'Generated: ' + ts : '';

  let totalAdded=0,totalRemoved=0,totalModified=0,totalConstraints=0;
  for (const t of Object.values(tables)) {
    totalAdded+=t.added.length; totalRemoved+=t.removed.length;
    totalModified+=t.modified.length; totalConstraints+=t.constraints.added.length;
  }
  const enumEntries = Object.entries(enums);
  const newTableCount = Object.keys(newTables).length;
  const droppedTableCount = droppedTables.size;

  const sb = document.getElementById('summary-bar');
  sb.innerHTML = '';
  const chips = [
    [newTableCount, 'added', 'new table'],
    [droppedTableCount, 'removed', 'dropped table'],
    [totalAdded, 'added', 'column added'],
    [totalRemoved, 'removed', 'column dropped'],
    [totalModified, 'modified', 'column altered'],
    [totalConstraints, 'constraint', 'constraint added'],
    [enumEntries.length, 'enum', 'enum type changed'],
  ];
  for (const [n, dotClass, label] of chips) {
    if (!n) continue;
    sb.innerHTML += `<span class="summary-chip"><span class="chip-dot ${dotClass}"></span>${n} ${label}${n!==1?'s':''}</span>`;
  }

  const out = document.getElementById('tables-output');
  out.innerHTML = '';

  // ── New tables (CREATE TABLE) ──
  for (const [tableName, info] of Object.entries(newTables)) {
    let colRows = '';
    for (const col of info.columns) colRows += fieldRow(col, 'added');

    let constraintHTML = '';
    if (info.constraints.length) {
      let tags = '';
      for (const c of info.constraints) {
        const isFK = /FOREIGN KEY/i.test(c.def), isUQ = /UNIQUE/i.test(c.def);
        tags += `<span class="ctag ${isFK?'fk':isUQ?'uq':'fk'}">${isFK?'FK':'UQ'} ${c.name.slice(0,32)}</span>`;
      }
      constraintHTML = `<div class="constraints-section"><div class="footer-label">Constraints</div><div class="constraint-chips">${tags}</div></div>`;
    }

    out.innerHTML += `
    <div class="table-card" style="border-color:var(--green-border)">
      <div class="table-card-header" style="background:var(--green-bg)">
        <div class="table-card-left">
          <div class="table-icon" style="background:var(--green-bg);border-color:var(--green-border);color:var(--green)">+</div>
          <span class="table-name">${tableName}</span>
          <span class="change-pill" style="background:var(--green-bg);border-color:var(--green-border);color:var(--green)">new table · ${info.columns.length} column${info.columns.length!==1?'s':''}</span>
        </div>
      </div>
      <div class="diff-pane" style="width:100%">
        <div class="pane-header"><span class="pane-dot after-dot"></span><span class="pane-label">All columns</span></div>
        ${colRows || '<div class="empty-pane">No columns detected</div>'}
      </div>
      <div class="card-footer">
        ${constraintHTML}
        <div class="base-fields-note">↳ Inherits: id · createdAt · updatedAt · deletedAt · createdById · updatedById</div>
      </div>
    </div>`;
  }

  // ── Dropped tables (DROP TABLE) ──
  for (const tableName of droppedTables) {
    out.innerHTML += `
    <div class="table-card" style="border-color:var(--red-border)">
      <div class="table-card-header" style="background:var(--red-bg)">
        <div class="table-card-left">
          <div class="table-icon" style="background:var(--red-bg);border-color:var(--red-border);color:var(--red)">−</div>
          <span class="table-name">${tableName}</span>
          <span class="change-pill" style="background:var(--red-bg);border-color:var(--red-border);color:var(--red)">dropped table</span>
        </div>
      </div>
      <div class="diff-pane" style="width:100%;padding:12px 14px">
        <div class="field-row removed" style="border-radius:6px">
          <span class="field-marker">−</span>
          <div><span class="field-name" style="color:var(--red)">Table and all its data will be permanently deleted</span></div>
        </div>
      </div>
    </div>`;
  }

  for (const [tableName, changes] of Object.entries(tables)) {
    const total = changes.added.length + changes.removed.length + changes.modified.length;
    const removedNames = new Set(changes.removed.map(c=>c.name));
    const addedNames = new Set(changes.added.map(c=>c.name));
    const typeChanged = [...removedNames].filter(n=>addedNames.has(n));

    let beforeRows = '', afterRows = '';

    // type-changed cols
    for (const col of typeChanged) {
      const bef = changes.removed.find(c=>c.name===col);
      const aft = changes.added.find(c=>c.name===col);
      beforeRows += fieldRow(bef,'removed');
      afterRows += fieldRow(aft,'added');
    }

    // purely removed
    for (const col of changes.removed.filter(c=>!typeChanged.includes(c.name))) beforeRows += fieldRow(col,'removed');
    // purely added
    for (const col of changes.added.filter(c=>!typeChanged.includes(c.name))) afterRows += fieldRow(col,'added');
    // modified
    for (const col of changes.modified) { beforeRows += fieldRow(col,'modified','was'); afterRows += fieldRow(col,'modified','now'); }

    const hasConstraints = changes.constraints.added.length || changes.constraints.removed.length;

    let constraintHTML = '';
    if (hasConstraints) {
      let tags = '';
      for (const c of changes.constraints.added) {
        const isFK = /FOREIGN KEY/i.test(c.def), isUQ = /UNIQUE/i.test(c.def);
        tags += `<span class="ctag ${isFK?'fk':isUQ?'uq':'fk'}">${isFK?'FK':'UQ'} ${c.name.slice(0,32)}</span>`;
      }
      for (const c of changes.constraints.removed) {
        tags += `<span class="ctag removed-c">− ${c.name.slice(0,32)}</span>`;
      }
      constraintHTML = `<div class="constraints-section"><div class="footer-label">Constraints</div><div class="constraint-chips">${tags}</div></div>`;
    }

    out.innerHTML += `
    <div class="table-card">
      <div class="table-card-header">
        <div class="table-card-left">
          <div class="table-icon">⊞</div>
          <span class="table-name">${tableName}</span>
          <span class="change-pill">${total} change${total!==1?'s':''}</span>
        </div>
      </div>
      <div class="diff-grid">
        <div class="diff-pane">
          <div class="pane-header"><span class="pane-dot before-dot"></span><span class="pane-label">Before</span></div>
          ${beforeRows || '<div class="empty-pane">No removals</div>'}
        </div>
        <div class="diff-pane">
          <div class="pane-header"><span class="pane-dot after-dot"></span><span class="pane-label">After</span></div>
          ${afterRows || '<div class="empty-pane">No additions</div>'}
        </div>
      </div>
      <div class="card-footer">
        ${constraintHTML}
        <div class="base-fields-note">↳ Inherits: id · createdAt · updatedAt · deletedAt · createdById · updatedById</div>
      </div>
    </div>`;
  }

  if (enumEntries.length) {
    let enumRows = '';
    for (const [name, info] of enumEntries) {
      const short = name.replace(/_enum$/, '');
      const actionClass = info.created && info.dropped ? 'replaced' : info.created ? 'created' : 'dropped';
      const vals = info.values ? info.values.map(v=>`'${v}'`).join(', ') : '';
      enumRows += `<div class="enum-row">
        <span class="enum-action ${actionClass}">${actionClass}</span>
        <span class="enum-name-text">${short}</span>
        ${vals ? `<span class="enum-vals-text">${vals}</span>` : ''}
      </div>`;
    }
    out.innerHTML += `
    <div class="enum-card">
      <div class="enum-header">
        <div class="table-icon" style="background:var(--purple-bg);border-color:var(--purple-border);color:var(--purple)">T</div>
        <span class="enum-header-title">PostgreSQL enum types</span>
        <span class="change-pill">${enumEntries.length}</span>
      </div>
      <div class="enum-rows">${enumRows}</div>
    </div>`;
  }
}

function fieldRow(col, state, prefix) {
  const markers = { removed:'−', added:'+', modified:'~' };
  const marker = markers[state] || ' ';
  const badgesHTML = (col.notes||[]).map(n => {
    if (/NOT NULL/i.test(n)) return `<span class="fbadge nn">NN</span>`;
    if (/DEFAULT/i.test(n)) return `<span class="fbadge def">${n}</span>`;
    if (/UNIQUE/i.test(n)) return `<span class="fbadge uq">UQ</span>`;
    return `<span class="fbadge">${n}</span>`;
  }).join('');
  const pfx = prefix ? `<span style="color:var(--text3);font-size:10px;margin-right:3px">${prefix}:</span>` : '';
  const typeStr = col.type ? `<span class="field-type"> ${col.type}</span>` : '';
  return `<div class="field-row ${state}">
    <span class="field-marker">${marker}</span>
    <div>${pfx}<span class="field-name">${col.name}</span>${typeStr}<span class="field-badges">${badgesHTML}</span></div>
  </div>`;
}

// ── Exports ──
function showLoading(text='Exporting…') {
  document.querySelector('#loading .loading-text').textContent = text;
  document.getElementById('loading').classList.add('show');
}
function hideLoading() { document.getElementById('loading').classList.remove('show'); }

function toast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function exportPNG() {
  showLoading('Rendering PNG…');
  await new Promise(r => setTimeout(r, 100));
  try {
    const target = document.getElementById('export-target');
    const canvas = await html2canvas(target, {
      backgroundColor: '#f6f8fa',
      scale: 2,
      useCORS: true,
      logging: false,
    });
    const link = document.createElement('a');
    link.download = (parsedData?.migName || 'migration') + '_diff.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    toast('PNG exported');
  } catch(e) { toast('Export failed: ' + e.message); }
  hideLoading();
}

async function exportPDF() {
  showLoading('Building PDF…');
  await new Promise(r => setTimeout(r, 100));
  try {
    const target = document.getElementById('export-target');
    const canvas = await html2canvas(target, {
      backgroundColor: '#f6f8fa',
      scale: 1.8,
      useCORS: true,
      logging: false,
    });
    const { jsPDF } = window.jspdf;
    const imgData = canvas.toDataURL('image/png');
    const pdfW = 210; // A4 mm
    const ratio = canvas.width / canvas.height;
    const pdfH = pdfW / ratio;
    const pdf = new jsPDF({ orientation: pdfH > pdfW ? 'p' : 'l', unit: 'mm', format: 'a4' });
    const pageH = pdf.internal.pageSize.getHeight();
    const pageW = pdf.internal.pageSize.getWidth();
    const imgW = pageW;
    const imgH = pageW / ratio;
    let yPos = 0;
    let remaining = imgH;
    let srcY = 0;
    while (remaining > 0) {
      const slice = Math.min(pageH, remaining);
      const sliceCanvas = document.createElement('canvas');
      sliceCanvas.width = canvas.width;
      sliceCanvas.height = (slice / imgH) * canvas.height;
      const ctx = sliceCanvas.getContext('2d');
      ctx.drawImage(canvas, 0, srcY, canvas.width, sliceCanvas.height, 0, 0, canvas.width, sliceCanvas.height);
      pdf.addImage(sliceCanvas.toDataURL('image/png'), 'PNG', 0, 0, pageW, slice);
      srcY += sliceCanvas.height;
      remaining -= slice;
      if (remaining > 0) pdf.addPage();
    }
    pdf.save((parsedData?.migName || 'migration') + '_diff.pdf');
    toast('PDF exported');
  } catch(e) { toast('Export failed: ' + e.message); }
  hideLoading();
}

function exportJSON() {
  if (!parsedData) return;
  const data = {
    migration: parsedData.migName,
    generatedAt: parsedData.ts,
    exportedAt: new Date().toISOString(),
    newTables: Object.fromEntries(Object.entries(parsedData.newTables).map(([n,v])=>([n,{columns:v.columns,constraints:v.constraints}]))),
    droppedTables: [...parsedData.droppedTables],
    tables: {},
    enums: parsedData.enums,
  };
  for (const [name, changes] of Object.entries(parsedData.tables)) {
    data.tables[name] = {
      columnsAdded: changes.added,
      columnsRemoved: changes.removed,
      columnsModified: changes.modified,
      constraintsAdded: changes.constraints.added,
      constraintsRemoved: changes.constraints.removed,
    };
  }
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = (parsedData.migName || 'migration') + '_diff.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('JSON exported');
}

function exportSQL() {
  if (!rawUpQueries.length) return;
  const header = `-- MigViz extracted SQL\n-- Migration: ${parsedData?.migName || 'unknown'}\n-- Exported: ${new Date().toISOString()}\n\n`;
  const sql = header + rawUpQueries.map(q => q + ';').join('\n\n');
  const blob = new Blob([sql], { type: 'text/sql' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = (parsedData?.migName || 'migration') + '_up.sql';
  a.click();
  URL.revokeObjectURL(url);
  toast('SQL exported');
}
