<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Cosine Similarity</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 16px;
        }

        @media (max-width: 1024px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        #vectorCanvas {
            width: 100%;
            height: auto;
        }

        .canvas-wrapper {
            aspect-ratio: 4/3;
        }

        .controls-card {
            position: sticky;
            top: 24px;
        }

        .rotation-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .rotation-controls button {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>3D Cosine Similarity</h1>
            <nav class="nav">
                <button class="btn btn-icon" id="themeToggle" aria-label="Toggle theme">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3"/>
                        <line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/>
                        <line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                </button>
                <a href="index.html" class="btn">Home</a>
                <a href="2d.html" class="btn">2D Mode</a>
            </nav>
        </header>

        <div class="main-layout">
            <div>
                <div class="card mb-4">
                    <div class="card-header">
                        <div class="rotation-controls">
                            <button class="btn btn-sm" id="rotateLeft">← Rotate Left</button>
                            <button class="btn btn-sm" id="rotateUp">↑ Rotate Up</button>
                            <button class="btn btn-sm" id="rotateDown">↓ Rotate Down</button>
                            <button class="btn btn-sm" id="rotateRight">Rotate Right →</button>
                        </div>
                    </div>
                    <div class="canvas-wrapper">
                        <div class="canvas-container">
                            <canvas id="vectorCanvas" width="800" height="600"></canvas>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h2>Similarity Matrix</h2>
                    </div>
                    <div class="card-body">
                        <div id="similarityMatrix"></div>
                    </div>
                </div>
            </div>

            <div class="controls-card">
                <div class="card mb-4">
                    <div class="card-header">
                        <h2>Add Vector</h2>
                    </div>
                    <div class="card-body">
                        <label class="label">Enter coordinates</label>
                        <input type="text" id="vectorInput" class="input mb-4" placeholder="[[x], [y], [z]]">
                        <button class="btn btn-primary" style="width: 100%" id="addVectorBtn">Add Vector</button>
                        <p class="text-sm text-center mt-4">
                            Format: [[x], [y], [z]]
                        </p>
                    </div>
                </div>

                <div class="card mb-4">
                    <div class="card-header">
                        <h2>Vectors</h2>
                    </div>
                    <div class="card-body">
                        <div id="vectorsList" class="vector-list"></div>
                        <button class="btn btn-sm mt-4" id="clearAllBtn">Clear All</button>
                    </div>
                </div>

                <div class="card" id="selectedInfoCard" style="display: none;">
                    <div class="card-header">
                        <h2>Selected Vector</h2>
                    </div>
                    <div class="card-body">
                        <div id="selectedVectorDetails"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="vector-math.js"></script>
    <script>
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            html.classList.add('dark');
        }
        themeToggle.addEventListener('click', () => {
            html.classList.toggle('dark');
            localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
        });

        // 3D Renderer with Isometric Projection
        class Renderer3D {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.angleX = 0.5;
                this.angleY = 0.5;
                this.setupCanvas();
                window.addEventListener('resize', () => this.setupCanvas());
            }

            setupCanvas() {
                const container = this.canvas.parentElement;
                const rect = container.getBoundingClientRect();
                this.canvas.width = rect.width;
                this.canvas.height = rect.height;
                this.width = this.canvas.width;
                this.height = this.canvas.height;
                this.scale = Math.min(this.width, this.height) / 20;
                this.origin = { x: this.width / 2, y: this.height / 2 };
            }

            project(x, y, z) {
                const cosX = Math.cos(this.angleX);
                const sinX = Math.sin(this.angleX);
                const cosY = Math.cos(this.angleY);
                const sinY = Math.sin(this.angleY);

                const y1 = y * cosX - z * sinX;
                const z1 = y * sinX + z * cosX;
                const x1 = x * cosY - z1 * sinY;
                const z2 = x * sinY + z1 * cosY;

                return {
                    x: this.origin.x + x1 * this.scale,
                    y: this.origin.y - y1 * this.scale,
                    z: z2
                };
            }

            clear() {
                this.ctx.clearRect(0, 0, this.width, this.height);
            }

            drawAxes() {
                const ctx = this.ctx;
                const isDark = html.classList.contains('dark');
                const axisColor = isDark ? '#52525b' : '#a1a1aa';

                const axes = [
                    { start: [-3, 0, 0], end: [3, 0, 0], label: 'X' },
                    { start: [0, -3, 0], end: [0, 3, 0], label: 'Y' },
                    { start: [0, 0, -3], end: [0, 0, 3], label: 'Z' }
                ];

                ctx.strokeStyle = axisColor;
                ctx.lineWidth = 2;
                ctx.font = 'bold 14px -apple-system, sans-serif';
                ctx.fillStyle = axisColor;

                axes.forEach(axis => {
                    const start = this.project(...axis.start);
                    const end = this.project(...axis.end);

                    ctx.beginPath();
                    ctx.moveTo(start.x, start.y);
                    ctx.lineTo(end.x, end.y);
                    ctx.stroke();

                    ctx.fillText(axis.label, end.x + 8, end.y - 8);
                });
            }

            drawGrid() {
                const ctx = this.ctx;
                const isDark = html.classList.contains('dark');
                const gridColor = isDark ? '#27272a' : '#e4e4e7';

                ctx.strokeStyle = gridColor;
                ctx.lineWidth = 1;

                for (let i = -3; i <= 3; i++) {
                    for (let j = -3; j <= 3; j++) {
                        // XY plane
                        let p1 = this.project(i, j, -3);
                        let p2 = this.project(i, j, 3);
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();

                        // XZ plane
                        p1 = this.project(i, -3, j);
                        p2 = this.project(i, 3, j);
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();

                        // YZ plane
                        p1 = this.project(-3, i, j);
                        p2 = this.project(3, i, j);
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            }

            drawVector(vector, isSelected) {
                const ctx = this.ctx;
                const origin = this.project(0, 0, 0);
                const end = this.project(...vector.components);

                ctx.strokeStyle = vector.color;
                ctx.lineWidth = isSelected ? 4 : 2;
                ctx.beginPath();
                ctx.moveTo(origin.x, origin.y);
                ctx.lineTo(end.x, end.y);
                ctx.stroke();

                const angle = Math.atan2(origin.y - end.y, end.x - origin.x);
                const headLen = 12;

                ctx.fillStyle = vector.color;
                ctx.beginPath();
                ctx.moveTo(end.x, end.y);
                ctx.lineTo(
                    end.x - headLen * Math.cos(angle - Math.PI / 6),
                    end.y + headLen * Math.sin(angle - Math.PI / 6)
                );
                ctx.lineTo(
                    end.x - headLen * Math.cos(angle + Math.PI / 6),
                    end.y + headLen * Math.sin(angle + Math.PI / 6)
                );
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = vector.color;
                ctx.font = 'bold 14px -apple-system, sans-serif';
                ctx.fillText(vector.name, end.x + 8, end.y - 8);

                const buffer = 10;
                vector.hitArea = {
                    x1: Math.min(origin.x, end.x) - buffer,
                    y1: Math.min(origin.y, end.y) - buffer,
                    x2: Math.max(origin.x, end.x) + buffer,
                    y2: Math.max(origin.y, end.y) + buffer
                };
            }

            render(vectors, selectedVector) {
                this.clear();
                this.drawGrid();
                this.drawAxes();
                vectors.forEach(v => this.drawVector(v, v === selectedVector));
            }
        }

        // App
        class App3D {
            constructor() {
                this.canvas = document.getElementById('vectorCanvas');
                this.renderer = new Renderer3D(this.canvas);
                this.vectors = [];
                this.selectedVector = null;
                this.vectorCounter = 0;
                this.colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4', '#84cc16'];

                this.initListeners();
                this.render();
            }

            initListeners() {
                document.getElementById('addVectorBtn').addEventListener('click', () => this.addFromInput());
                document.getElementById('vectorInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.addFromInput();
                });
                document.getElementById('clearAllBtn').addEventListener('click', () => this.clearAll());

                document.getElementById('rotateLeft').addEventListener('click', () => {
                    this.renderer.angleY -= 0.1;
                    this.render();
                });
                document.getElementById('rotateRight').addEventListener('click', () => {
                    this.renderer.angleY += 0.1;
                    this.render();
                });
                document.getElementById('rotateUp').addEventListener('click', () => {
                    this.renderer.angleX -= 0.1;
                    this.render();
                });
                document.getElementById('rotateDown').addEventListener('click', () => {
                    this.renderer.angleX += 0.1;
                    this.render();
                });

                this.canvas.addEventListener('click', (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;

                    const clicked = this.vectors.find(v => {
                        if (!v.hitArea) return false;
                        return x >= v.hitArea.x1 && x <= v.hitArea.x2 && y >= v.hitArea.y1 && y <= v.hitArea.y2;
                    });

                    if (clicked) {
                        this.selectVector(clicked);
                    }
                });
            }

            addFromInput() {
                const input = document.getElementById('vectorInput');
                const parsed = VectorMath.parse(input.value);
                if (!parsed || parsed.length < 3 || parsed.some(isNaN)) {
                    alert('Invalid format. Use [[x], [y], [z]]');
                    return;
                }
                this.addVector([parsed[0], parsed[1], parsed[2]]);
                input.value = '';
            }

            addVector(components) {
                this.vectorCounter++;
                this.vectors.push({
                    id: this.vectorCounter,
                    name: `v${this.vectorCounter}`,
                    components,
                    color: this.colors[this.vectors.length % this.colors.length]
                });
                this.updateUI();
            }

            selectVector(vector) {
                this.selectedVector = vector;
                const card = document.getElementById('selectedInfoCard');
                const details = document.getElementById('selectedVectorDetails');

                card.style.display = 'block';
                let html = `<strong>${vector.name}</strong> = [${vector.components.map(c => c.toFixed(1)).join(', ')}]<br><br>`;
                html += `Magnitude: ${VectorMath.magnitude(vector.components).toFixed(3)}<br><br>`;
                if (this.vectors.length > 1) {
                    html += `<strong>Similarities:</strong><br>`;
                    this.vectors.forEach(v => {
                        if (v.id !== vector.id) {
                            const sim = VectorMath.cosineSimilarity(vector.components, v.components);
                            html += `${v.name}: ${sim.toFixed(3)} (${(sim * 100).toFixed(1)}%)<br>`;
                        }
                    });
                }
                details.innerHTML = html;
                this.render();
            }

            deleteVector(id) {
                this.vectors = this.vectors.filter(v => v.id !== id);
                if (this.selectedVector?.id === id) {
                    this.selectedVector = null;
                    document.getElementById('selectedInfoCard').style.display = 'none';
                }
                this.updateUI();
            }

            clearAll() {
                this.vectors = [];
                this.selectedVector = null;
                document.getElementById('selectedInfoCard').style.display = 'none';
                this.updateUI();
            }

            updateUI() {
                this.render();
                this.updateVectorsList();
                this.updateSimilarityMatrix();
            }

            updateVectorsList() {
                const list = document.getElementById('vectorsList');
                list.innerHTML = this.vectors.map(v => `
                    <div class="vector-item">
                        <div class="vector-color" style="background: ${v.color}"></div>
                        <div class="vector-info">
                            <div class="vector-name">${v.name}</div>
                            <div class="vector-coords">[${v.components.map(c => c.toFixed(1)).join(', ')}]</div>
                        </div>
                        <button class="btn btn-sm" onclick="app.deleteVector(${v.id})">×</button>
                    </div>
                `).join('');
            }

            updateSimilarityMatrix() {
                const container = document.getElementById('similarityMatrix');
                if (this.vectors.length < 2) {
                    container.innerHTML = '<p class="text-sm text-center">Add at least 2 vectors</p>';
                    return;
                }

                let html = '<table class="table"><thead><tr><th></th>';
                this.vectors.forEach(v => html += `<th>${v.name}</th>`);
                html += '</tr></thead><tbody>';

                this.vectors.forEach(v1 => {
                    html += `<tr><th>${v1.name}</th>`;
                    this.vectors.forEach(v2 => {
                        const sim = VectorMath.cosineSimilarity(v1.components, v2.components);
                        const cls = Math.abs(sim) >= 0.8 ? 'similarity-high' : Math.abs(sim) >= 0.5 ? 'similarity-medium' : 'similarity-low';
                        html += `<td><span class="${cls}">${sim.toFixed(3)}</span></td>`;
                    });
                    html += '</tr>';
                });

                html += '</tbody></table>';
                container.innerHTML = html;
            }

            render() {
                this.renderer.render(this.vectors, this.selectedVector);
            }
        }

        const app = new App3D();
    </script>
</body>
</html>
