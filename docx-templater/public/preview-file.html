<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>File Preview – Docx Replacer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/jszip/dist/jszip.min.js"></script>
  <script src="https://unpkg.com/docx-preview/dist/docx-preview.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #111010; --paper: #f4f1ea; --accent: #c0392b;
      --amber: #d4820a; --green: #2a7a50;
      --mono: 'DM Mono', monospace; --sans: 'Syne', sans-serif; --radius: 3px;
    }
    html, body { height: 100%; overflow: hidden; }
    body { background: #252525; color: var(--paper); font-family: var(--mono); display: flex; flex-direction: column; }

    /* ── Topbar ── */
    .topbar {
      background: var(--ink); padding: 0 20px; height: 50px;
      display: flex; align-items: center; gap: 14px;
      flex-shrink: 0; border-bottom: 3px solid var(--accent);
    }
    .topbar-brand { font-family: var(--sans); font-weight: 800; font-size: 15px; letter-spacing: -0.5px; white-space: nowrap; }
    .topbar-brand span { color: var(--accent); }
    .topbar-brand .slash { opacity: .3; font-weight: 400; font-size: 12px; }

    .file-pill {
      flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px;
    }
    .file-name {
      font-size: 12px; color: rgba(255,255,255,.65); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; min-width: 0;
    }
    .file-name.empty { color: rgba(255,255,255,.2); font-style: italic; }

    .status-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
      background: rgba(255,255,255,.15); transition: background .3s;
    }
    .status-dot.ok  { background: #6ee0a2; }
    .status-dot.err { background: #f0847a; }
    .status-dot.loading { background: var(--amber); animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity:.4; } 50% { opacity:1; } }

    .topbar-btn {
      font-family: var(--sans); font-size: 11px; font-weight: 700;
      padding: 6px 13px; border-radius: var(--radius); cursor: pointer;
      letter-spacing: .04em; white-space: nowrap; border: 1.5px solid transparent;
      display: flex; align-items: center; gap: 6px; transition: all .15s; text-decoration: none;
    }
    .topbar-btn.amber  { background: var(--amber); color: var(--ink); border: none; }
    .topbar-btn.amber:hover  { opacity: .88; }
    .topbar-btn.ghost  { background: rgba(255,255,255,.06); color: rgba(255,255,255,.45); border-color: rgba(255,255,255,.1); }
    .topbar-btn.ghost:hover { background: rgba(255,255,255,.11); color: rgba(255,255,255,.75); }
    .topbar-btn.danger { background: rgba(192,57,43,.15); color: #f0847a; border-color: rgba(192,57,43,.3); }
    .topbar-btn.danger:hover { background: rgba(192,57,43,.28); }

    /* ── Viewport ── */
    .preview-viewport {
      flex: 1; overflow-y: auto; padding: 22px;
      display: flex; flex-direction: column; align-items: center; gap: 14px; min-height: 0;
    }
    .preview-viewport::-webkit-scrollbar { width: 5px; }
    .preview-viewport::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 3px; }

    /* Empty / landing */
    .landing {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 20px; flex: 1;
      text-align: center; padding: 40px;
    }
    .landing-icon { font-size: 52px; opacity: .18; }
    .landing-title { font-family: var(--sans); font-size: 18px; font-weight: 700; color: rgba(255,255,255,.2); }
    .landing-sub { font-size: 12px; color: rgba(255,255,255,.13); max-width: 300px; line-height: 1.75; }
    .landing-pick {
      font-family: var(--sans); font-size: 13px; font-weight: 700;
      padding: 11px 24px; background: var(--amber); color: var(--ink);
      border: none; border-radius: var(--radius); cursor: pointer;
      letter-spacing: .04em; transition: opacity .15s; margin-top: 4px;
    }
    .landing-pick:hover { opacity: .88; }

    /* Loading */
    .preview-loading {
      display: none; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px; flex: 1; color: rgba(255,255,255,.4);
    }
    .preview-loading.show { display: flex; }
    .big-spinner {
      width: 34px; height: 34px;
      border: 3px solid rgba(255,255,255,.1); border-top-color: rgba(255,255,255,.5);
      border-radius: 50%; animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .preview-loading p { font-size: 12px; }

    /* Docx */
    #docx-container {
      width: 100%; max-width: 800px;
      display: none; animation: fadeIn .3s ease forwards;
    }
    #docx-container.show { display: block; }
    #docx-container .docx-wrapper { background: transparent !important; padding: 20px 0 !important; }
    #docx-container .docx-wrapper > section.docx {
      box-shadow: 0 1px 8px rgba(0,0,0,.2) !important; margin-bottom: 16px !important;
    }
    @keyframes fadeIn { to { opacity: 1; } }

    /* Error */
    .preview-error {
      background: rgba(192,57,43,.12); border: 1px solid rgba(192,57,43,.3);
      border-radius: var(--radius); padding: 16px 20px; max-width: 520px;
      color: #f0847a; font-size: 12px; line-height: 1.7; text-align: center;
    }
    .preview-error strong { display: block; margin-bottom: 5px; font-family: var(--sans); font-size: 13px; }
    .preview-error .retry-link {
      display: inline-block; margin-top: 10px; font-family: var(--sans);
      font-size: 11px; font-weight: 700; padding: 6px 14px;
      background: rgba(192,57,43,.2); border: 1px solid rgba(192,57,43,.35);
      border-radius: var(--radius); color: #f0847a; cursor: pointer;
      letter-spacing: .04em;
    }
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-brand">Docx <span>Replacer</span><span class="slash"> / File Preview</span></div>

  <div class="file-pill">
    <span class="status-dot" id="status-dot"></span>
    <span class="file-name empty" id="file-name">No file selected</span>
  </div>

  <button class="topbar-btn amber" id="pick-btn">📂 Pick file…</button>
  <button class="topbar-btn ghost" id="reload-btn" style="display:none" title="Re-read from disk">↺ Reload</button>
  <button class="topbar-btn danger" id="clear-btn" style="display:none" title="Forget this file">✕ Clear</button>
  <a href="/" class="topbar-btn ghost">← Editor</a>
</header>

<div class="preview-viewport" id="preview-viewport">
  <div class="landing" id="landing">
    <div class="landing-icon">📄</div>
    <div class="landing-title">Pick a .docx to preview</div>
    <div class="landing-sub">The file is remembered across reloads. Refresh the page any time to pick up the latest changes from disk.</div>
    <button class="landing-pick" id="landing-pick-btn">📂 Choose file…</button>
  </div>
  <div class="preview-loading" id="preview-loading">
    <div class="big-spinner"></div>
    <p id="loading-msg">Reading file…</p>
  </div>
  <div id="docx-container"></div>
</div>

<script>
  // ── IndexedDB helpers (store FileSystemFileHandle across reloads)
  const DB_NAME = 'docxFilePreview', STORE = 'handles', KEY = 'current';

  function openDB() {
    return new Promise((res, rej) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = e => e.target.result.createObjectStore(STORE);
      req.onsuccess = e => res(e.target.result);
      req.onerror = e => rej(e.target.error);
    });
  }
  async function saveHandle(handle) {
    const db = await openDB();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(handle, KEY);
      tx.oncomplete = () => res();
      tx.onerror = e => rej(e.target.error);
    });
  }
  async function loadHandle() {
    const db = await openDB();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).get(KEY);
      req.onsuccess = e => res(e.target.result || null);
      req.onerror = e => rej(e.target.error);
    });
  }
  async function clearHandle() {
    const db = await openDB();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete(KEY);
      tx.oncomplete = () => res();
      tx.onerror = e => rej(e.target.error);
    });
  }

  // ── UI refs
  const landing       = document.getElementById('landing');
  const landingPickBtn= document.getElementById('landing-pick-btn');
  const previewLoad   = document.getElementById('preview-loading');
  const loadingMsg    = document.getElementById('loading-msg');
  const container     = document.getElementById('docx-container');
  const viewport      = document.getElementById('preview-viewport');
  const pickBtn       = document.getElementById('pick-btn');
  const reloadBtn     = document.getElementById('reload-btn');
  const clearBtn      = document.getElementById('clear-btn');
  const statusDot     = document.getElementById('status-dot');
  const fileNameEl    = document.getElementById('file-name');

  let currentHandle = null;

  function setStatus(type) { statusDot.className = 'status-dot ' + type; }

  function showLanding() {
    landing.style.display = '';
    previewLoad.classList.remove('show');
    container.classList.remove('show');
    container.innerHTML = '';
    viewport.querySelectorAll('.preview-error').forEach(n => n.remove());
    reloadBtn.style.display = 'none';
    clearBtn.style.display = 'none';
    fileNameEl.textContent = 'No file selected';
    fileNameEl.className = 'file-name empty';
    setStatus('');
  }

  function showError(msg) {
    landing.style.display = 'none';
    previewLoad.classList.remove('show');
    container.classList.remove('show');
    container.innerHTML = '';
    viewport.querySelectorAll('.preview-error').forEach(n => n.remove());
    const div = document.createElement('div');
    div.className = 'preview-error';
    div.innerHTML = `<strong>Cannot load file</strong>${msg}<br><button class="retry-link" onclick="renderFromHandle()">Try again</button>`;
    viewport.appendChild(div);
    setStatus('err');
  }

  async function renderFromHandle() {
    if (!currentHandle) return;

    // Check/request permission
    const perm = await currentHandle.queryPermission({ mode: 'read' });
    if (perm !== 'granted') {
      const req = await currentHandle.requestPermission({ mode: 'read' });
      if (req !== 'granted') { showError('Permission to read the file was denied.'); return; }
    }

    landing.style.display = 'none';
    previewLoad.classList.add('show');
    container.classList.remove('show');
    container.innerHTML = '';
    viewport.querySelectorAll('.preview-error').forEach(n => n.remove());
    setStatus('loading');
    loadingMsg.textContent = 'Reading from disk…';

    try {
      const file = await currentHandle.getFile();
      fileNameEl.textContent = file.name;
      fileNameEl.className = 'file-name';
      document.title = file.name + ' – File Preview';

      loadingMsg.textContent = 'Rendering…';
      const buf = await file.arrayBuffer();
      container.classList.add('show');
      await docx.renderAsync(buf, container, null, {
        className: 'docx', inWrapper: true,
        ignoreWidth: false, ignoreHeight: false, ignoreFonts: false,
        breakPages: true, useBase64URL: true,
        renderChanges: false, renderHeaders: true, renderFooters: true,
      });

      previewLoad.classList.remove('show');
      setStatus('ok');
      reloadBtn.style.display = '';
      clearBtn.style.display = '';
      viewport.scrollTop = 0;

    } catch(err) {
      showError(err.message);
    }
  }

  async function pickFile() {
    if (!('showOpenFilePicker' in window)) {
      alert('Your browser does not support the File System Access API. Try Chrome or Edge.');
      return;
    }
    try {
      const [handle] = await window.showOpenFilePicker({
        types: [{ description: 'Word Documents', accept: { 'application/vnd.openxmlformats-officedocument.wordprocessingml.document': ['.docx'] } }],
        multiple: false,
      });
      currentHandle = handle;
      await saveHandle(handle);
      await renderFromHandle();
    } catch(e) {
      if (e.name !== 'AbortError') showError(e.message);
    }
  }

  async function init() {
    try {
      const handle = await loadHandle();
      if (handle) {
        currentHandle = handle;
        await renderFromHandle();
        return;
      }
    } catch { /* ignore */ }
    showLanding();
  }

  pickBtn.addEventListener('click', pickFile);
  landingPickBtn.addEventListener('click', pickFile);
  reloadBtn.addEventListener('click', renderFromHandle);
  clearBtn.addEventListener('click', async () => {
    await clearHandle();
    currentHandle = null;
    showLanding();
  });

  init();
</script>
</body>
</html>
